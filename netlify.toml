# Netlify — Bare Roots
#
# No `publish` key on purpose. @netlify/plugin-nextjs decides the output
# directory; hardcoding one is how a build silently ships a stale or empty site
# the first time the framework moves its output.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # The audit scripts drive a real browser, but they are developer tools and
  # are never run in the deploy. Skipping the browser download keeps the build
  # short if playwright is ever added as a devDependency.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Content-hashed by Next, self-hosted fonts included. Safe to cache forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Brand imagery is versioned by filename, so it is immutable too. If an image
# is replaced, change the filename — do not overwrite it in place.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The private tree must never be indexed, and robots.txt is not a guarantee.
[[headers]]
  for = "/portal/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/checkout"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
